services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codezen_postgres
    environment:
      POSTGRES_USER: codezen
      POSTGRES_PASSWORD: codezen_secret
      POSTGRES_DB: codezen_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codezen -d codezen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codezen_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: codezen_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000

volumes:
  pgdata:
  redisdata:
  chromadata:
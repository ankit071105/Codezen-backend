<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12B4C4"/>
      <stop offset="1" stop-color="#0A7A85"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAFBFD"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="58" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="58" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- code bracket, left -->
  <path d="M100 78 L66 128 L100 178" fill="none" stroke="url(#glyph)"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- code bracket, right -->
  <path d="M156 78 L190 128 L156 178" fill="none" stroke="url(#glyph)"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- flow node dot at center: the "drawing becomes code" idea -->
  <circle cx="128" cy="128" r="15" fill="#ffffff"/>
  <circle cx="128" cy="128" r="15" fill="none" stroke="#0A7A85" stroke-width="3" opacity="0.35"/>
</svg>
